<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <nav class="navbar">
        <div class="logo">
            AI Workflow Hub
        </div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="AiWorkFlow.html">AI Workflows</a></li>
            <li><a href="AiToools.html">AI Tools</a></li>
            <li><a href="Promptlibrary.html">Prompt Library</a></li>
            <li><a href="Resources.html">Resources</a></li>
            <li><a href="Templates.html">Templates</a></li>
        </ul>

        <div class="auth-buttons">
           <a href="/login" class="login">Login</a>
<a href="/signup" class="signup">Sign Up</a>

    </nav>
    <section class="login-section">

        <div class="login-container">

            <div class="login-header">

                <h1>Welcome Back</h1>

                <p>
                    Login to continue to AI Workflow Hub
                </p>

            </div>


            <form class="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                </div>


                <div class="login-options">

                    <label class="remember-me">

                        <input type="checkbox" name="remember">

                        <span>Remember me</span>

                    </label>

                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>

                </div>


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>


            <div class="signup-link">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create an account</a>
                </p>

            </div>
        </div>
    
    </section>

</body>

</html>
